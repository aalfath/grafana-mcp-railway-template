# Local test only. Run: LOCAL_ADMIN_PASSWORD=$(openssl rand -hex 16) LOCAL_MCP_TOKEN=$(openssl rand -hex 32) docker compose up --build
services:
  grafana:
    build: ./grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?set LOCAL_ADMIN_PASSWORD}
    volumes: [grafana-data:/var/lib/grafana]
    ports: ["3000:3000"]
  mcp:
    build: ./mcp
    environment:
      PORT: "8000"
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?set LOCAL_ADMIN_PASSWORD}
      MCP_GRAFANA_SERVER_TOKEN: ${LOCAL_MCP_TOKEN:?set LOCAL_MCP_TOKEN}
      GRAFANA_USAGE_STATS: disabled
    ports: ["8000:8000"]
    depends_on: [grafana]
volumes:
  grafana-data:
